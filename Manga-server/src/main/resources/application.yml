spring:
  config:
    # 兼容从后端目录或仓库根目录启动，加载不提交仓库的本地 .env。
    import:
      - optional:file:.env[.properties]
      - optional:file:Manga-server/.env[.properties]
  application:
    name: manga-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      # 单个剧本上传文件的大小上限，支持 MB 等容量单位。
      max-file-size: ${MANGA_SCRIPT_UPLOAD_MAX_FILE_SIZE:20MB}
      # 整个上传请求的大小上限，需容纳文件内容及表单开销。
      max-request-size: ${MANGA_SCRIPT_UPLOAD_MAX_REQUEST_SIZE:21MB}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

springdoc:
  api-docs:
    enabled: ${MANGA_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${MANGA_SWAGGER_UI_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.manga.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

manga:
  # API 文档展示信息。
  openapi:
    # OpenAPI 文档标题。
    title: Manga AI Platform API
    # OpenAPI 文档中的平台业务说明。
    description: Manga AI 漫剧生成平台后端接口
    # API 文档版本，与创作引擎和工作流版本分别维护。
    version: v1
  # 剧本导入后台任务。
  script:
    task:
      # 导入任务原始输入的临时存储目录，相对路径基于进程工作目录解析。
      input-directory: data/script-tasks
      # 单次导入输入的最大字节数，同时约束文本和文件输入。
      max-input-size: ${MANGA_SCRIPT_TASK_MAX_INPUT_SIZE:20000000}
      # 导入任务允许的最大尝试次数，包含首次处理。
      max-attempts: 3
  # 平台访问外部服务的通用 HTTP 超时，时长需携带 s、m 等单位。
  external-http:
    # 建立外部 HTTP 连接的最长等待时间。
    connect-timeout: 10s
    # 外部 HTTP 请求允许等待的最长时间。
    request-timeout: 30s
  # 用户 AI 服务商配置的敏感凭据保护。
  ai:
    secrets:
      # 加密数据库中的 AI API Key；生产环境使用独立密钥，本地未配置时回退到 JWT 密钥。
      encryption-key: ${MANGA_AI_SECRET_ENCRYPTION_KEY:${MANGA_JWT_SECRET:}}
  # Step 执行和后台任务共用的受控线程池。
  executors:
    common:
      # 通用业务线程池核心线程数，单位：个。
      core-pool-size: 4
      # 通用业务线程池最大线程数，不应小于核心线程数。
      max-pool-size: 16
      # 等待执行的任务队列容量，单位：条任务。
      queue-capacity: 200
      # 非核心线程空闲后的保留时长。
      keep-alive: 60s
      # 应用关闭时等待已提交任务完成的最长时间。
      await-termination: 30s
      # 业务工作线程名称前缀，用于日志和线程排障。
      thread-name-prefix: manga-common-
      # 定时扫描与租约心跳共用调度器的线程数，单位：个。
      scheduled-pool-size: 2
      # 定时调度线程名称前缀。
      scheduled-thread-name-prefix: manga-scheduled-
  # 外部身份登录的临时会话存储。
  auth:
    storage:
      # 扫码等外部登录会话的存储实现，可选 redis 或 jdbc。
      external-login-session: redis
  # 本地上传文件保存位置与图片限制。
  upload:
    # 本地上传目录，相对路径基于进程工作目录解析。
    directory: ${MANGA_UPLOAD_DIR:uploads}
    # 本地上传文件映射到 HTTP 的公开路径前缀。
    public-path: ${MANGA_UPLOAD_PUBLIC_PATH:/uploads}
    # 单张上传图片的大小上限，支持 MB 等容量单位。
    max-image-size: ${MANGA_UPLOAD_MAX_IMAGE_SIZE:8MB}
  # 媒体文件的对象存储配置。
  storage:
    aliyun-oss:
      # 是否启用阿里云 OSS 存储策略，客户端创建还要求凭据配置完整。
      enabled: ${MANGA_OSS_ENABLED:true}
      # OSS Bucket 所在地域的服务 Endpoint。
      endpoint: ${MANGA_OSS_ENDPOINT:}
      # 接收平台媒体文件的 Bucket 名称。
      bucket-name: ${MANGA_OSS_BUCKET_NAME:manga-ai}
      # OSS 访问凭据标识，通过环境变量提供。
      access-key-id: ${MANGA_OSS_ACCESS_KEY_ID:}
      # OSS 访问密钥，通过环境变量提供，不写入源码或日志。
      access-key-secret: ${MANGA_OSS_ACCESS_KEY_SECRET:}
      # 上传对象在 Bucket 内的统一路径前缀。
      object-prefix: ${MANGA_OSS_OBJECT_PREFIX:mannga}
      # 可选的 OSS 自定义访问域名或 CDN 地址，用于生成媒体公开链接。
      public-domain: ${MANGA_OSS_PUBLIC_DOMAIN:}
  # Redis 业务键命名和临时登录数据保留策略。
  redis:
    # 平台 Redis 键的统一前缀，用于隔离业务键空间。
    key-prefix: manga
    # 登录会话失效后继续保留记录的时长，用于区分过期与不存在。
    external-login-expired-retention: 10m
  # 浏览器跨域、登录令牌和首次管理员初始化。
  security:
    # 允许跨域请求的前端来源列表，多个来源以逗号分隔。
    allowed-origins: ${MANGA_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # 浏览器可缓存 CORS 预检结果的时长。
    cors-max-age: ${MANGA_CORS_MAX_AGE:1h}
    jwt:
      # 登录令牌签名密钥，通过环境变量提供。
      secret: ${MANGA_JWT_SECRET:}
      # 平台签发并校验登录令牌时使用的 issuer 标识。
      issuer: manga-server
      # 正式用户访问令牌的有效期。
      access-token-ttl: 2h
      # 游客访问令牌的有效期。
      guest-token-ttl: 30m
    initial-admin:
      # 初始化管理员账号的登录名。
      username: ${MANGA_INITIAL_ADMIN_USERNAME:admin}
      # 创建初始管理员时使用的密码，通过环境变量提供。
      password: ${MANGA_INITIAL_ADMIN_PASSWORD:}
      # 初始化管理员账号的展示名称。
      display-name: Manga Administrator
  # 可恢复创作运行、Agent 执行与调度补偿。
  creative:
    # 图片生成作业独立于 Agent Harness；配置预计费用后才允许真实付费提案。
    generation:
      # 独立媒体 worker 数，范围 1 到 32；不会占满 Agent 通用线程池。
      worker-threads: 4
      # 等待队列容量，满时保留数据库作业，交由扫描补偿。
      worker-queue-capacity: 40
      # 补偿扫描间隔，正常审批提交会立即唤醒，不等待该扫描。
      scan-interval: 3s
      # 每次扫描最多领取数量，范围 1 到 100。
      batch-size: 20
      # 每个供应商的在途和 UNKNOWN 作业上限，跨实例共享。
      provider-concurrency: 4
      # 同一用户、同一供应商的在途和 UNKNOWN 作业上限。
      user-concurrency: 2
      # worker 租约，必须大于 http-timeout 的三倍。
      lease: 20m
      # 异步供应商正常查询间隔；OpenAI Images API 不支持作业查询。
      poll-interval: 10s
      # 查询或转存故障的最大退避时间，不重提付费生成。
      max-backoff: 5m
      # 最长监测时间，超时进入 UNKNOWN，不能假定供应商已停止。
      max-age: 24h
      # Fake 模拟器完成时间，必须大于零。
      fake-duration: 15s
      # 单张 PNG 的最大字节数，范围 1024 到 33554432。
      max-media-bytes: 20971520
      # 生成请求的完整等待超时，独立于连接检测的短超时。
      http-timeout: 5m
      # 单张 medium 质量预计费用，单位 USD；需运维核价。空配置禁用真实生成。
      # 这不是 OpenAI 的扣费硬上限，实际账单以供应商为准。
      image-prices:
        # 用户核定的单张预计费用，单位 USD；不是供应商扣费硬上限。
        gpt-image-2: 1
      # 平台异步中继 HMAC 密钥，至少 32 字符；空时关闭，当前仅供 Fake 验证。
      callback-secret: ${MANGA_GENERATION_CALLBACK_SECRET:}
      # 签名回调允许的时间偏移，单位分钟；防止长期重放。
      callback-clock-skew: 5m
      # 未发布生成对象的回收；只处理数据库登记记录，不扫描任意目录。
      cleanup:
        # 到期对象扫描周期，调度器只提交有界后台任务。
        scan-interval: 10m
        # 每批最多处理数量，范围 1 到 100。
        batch-size: 20
        # 写入前登记后至少等待此时长再回收，同时复核有效 Job lease。
        grace: 24h
        # 单次回收执行权，跨实例互斥，过期可以再次领取。
        lease: 5m
        # 存储不可用或仍有活动写入时的复查间隔。
        retry-delay: 1h
        # 已删除墓碑仍周期复查，清除极晚到旧 worker 的重新写入。
        tombstone-interval: 24h
      # 配置示例：image-prices: { gpt-image-2: 0.10 }；示例数字不是官方报价。
    # AI 提案审批：等待期间释放 Harness 和 Kernel，业务写入只在批准事务发生。
    approval:
      # 从开放审批开始计算的有效期，必须大于零。
      ttl: 24h
      # 过期审批补偿扫描间隔，数据库事实决定最终状态。
      maintenance-interval: 1m
      # 单批最多处理的过期审批数量，范围 1 到 500。
      batch-size: 100
    # 消息投影、连续对话上下文和内部状态保留策略。
    memory:
      # 单批投影的最大事件条数，消息与 cursor 在同一事务提交。
      projection-batch-size: 200
      # 消息历史单页上限，也是上下文构建每批读取的最大消息数。
      history-page-size: 100
      # 历史上下文字符预算，不包含本轮用户指令、系统提示词和本轮工具结果。
      context-max-chars: 24000
      # 提取式摘要字符预算，必须小于 context-max-chars。
      summary-max-chars: 6000
      # 摘要之外最多保留的近期完整消息条数，超预算时继续压缩。
      recent-messages: 12
      # Run 到期后保留内部 AgentState 的时长，不清理业务消息和事件日志。
      state-retention: 7d
      # 投影补偿与内部状态清理任务的执行间隔。
      maintenance-interval: 1m
    # 内置 Agent Profile 的提示词、定义版本和推理限制。
    agent:
      # Director 的系统提示词资源位置。
      director-prompt-resource: classpath:agent/profiles/manga-director-system.md
      # Director 定义的语义版本；提示词或行为契约变化时递增，并参与 Blueprint 指纹。
      director-profile-version: 5
      # Director 单次调用允许的最大模型推理轮次，达到限制后失败。
      director-max-turns: 12
      # 只读剧本解析 Agent 的系统提示词资源位置。
      script-parser-prompt-resource: classpath:agent/profiles/script-parser-system.md
      # 剧本解析 Profile 的语义版本，参与 Blueprint 指纹计算。
      script-parser-profile-version: 1
      # 剧本解析单次调用允许的最大模型推理轮次，需覆盖章节读取与报告生成。
      script-parser-max-turns: 24
      # 模型上下文窗口，单位：token，最小值为 1024；Harness 在约 75% 窗口时执行语义压缩。
      context-window: ${MANGA_CREATIVE_AGENT_CONTEXT_WINDOW:32768}
      # 请求级 Harness 隔离、状态会话互斥及共享 Kernel 资源限制。
      harness:
        # 同一 StateSession 的独占租约时长，由心跳续签，防止并发使用同一会话状态。
        session-lease: ${MANGA_CREATIVE_AGENT_SESSION_LEASE:30s}
        # 单实例允许缓存的最大共享 Kernel 数量，单位：个。
        max-kernels: ${MANGA_CREATIVE_AGENT_MAX_KERNELS:8}
        # Kernel 容量用尽时等待空闲资源的最长时间。
        kernel-acquire-timeout: ${MANGA_CREATIVE_AGENT_KERNEL_ACQUIRE_TIMEOUT:5s}
        # 应用关闭时等待活跃 KernelHandle 和 HarnessLease 释放的最长时间。
        shutdown-drain-timeout: ${MANGA_CREATIVE_AGENT_SHUTDOWN_DRAIN_TIMEOUT:30s}
    # 运行时临时 Worker 的规划边界；实际 token 结算属于用量账本。
    dynamic-agent:
      # 含修订的临时节点总数。
      max-agents: 6
      # 单 Run 不同临时执行规格的上限，全局仍受 Kernel 池约束。
      max-kernels: 4
      # 累计最大推理轮数预留，故障不退款。
      max-reserved-turns: 64
      # 临时 Worker 每次最大推理轮数。
      max-turns: 8
      # 累计临时提示词字符数。
      max-prompt-characters: 18000
      # 规划费用额度，单位 USD，并非供应商实际扣费保证。
      max-estimated-usd: 1
      # 运维提供每轮规划估值，单位 USD；留空时禁止新建临时 Agent。
      estimated-usd-per-turn: ${MANGA_DYNAMIC_AGENT_ESTIMATED_USD_PER_TURN:}
    # 管理员专业 Agent 配置、版本与只读测试边界。
    profile-management:
      # 平台配置身份总数上限，包含内置定义。
      max-profiles: 100
      # 每个身份保留的最大版本数，不自动删除发布历史。
      max-versions: 100
      # 管理员真实只读测试的推理轮数上限，预览不调用模型。
      test-max-turns: 4
    # 模型步骤的专用有界线程池；饱和时拒绝并由 Outbox 补投，不占用请求线程运行模型。
    dispatch-pool:
      # 常驻执行线程数。
      core-pool-size: 4
      # 最大执行线程数，需结合 Kernel 容量与模型并发限制调整。
      max-pool-size: 8
      # 等待队列容量，单位：个任务。
      queue-capacity: 128
      # 关闭时等待执行资源释放的最长时间。
      await-termination: 30s
    # 多 Agent 协作；预算在 Run 受理时冻结，Worker 只产出候选内容，业务写入仍须审批。
    collaboration:
      # 每个 Run 的步骤总数上限，包含根、Worker 和汇合节点。
      max-steps: 32
      # 根深度为零；首版仅允许 Director 委派，不开放 Worker 递归委派。
      max-depth: 3
      # 同 Run 同时持有执行租约的步骤数上限，不代表进程线程池容量。
      max-parallel: 3
      # 首轮计划之外的修订轮数，耗尽时不再调用模型。
      max-repair-rounds: 2
      # 含故障重试的模型执行次数总额。
      max-invocations: 24
      # 按每次 Blueprint.maxTurns + 1 保守预留，不是实际 token 或美元计费。
      max-reserved-turns: 256
      # 一次委派最多创建的 Worker 数量。
      max-batch-size: 8
      # 单份结构化结果的序列化字符上限，候选正文不会完整拼接进父上下文。
      max-result-characters: 24000
      # 内置编剧、分镜导演与连续性评审师的提示词语义版本。
      worker-profile-version: 1
      # Worker 每次执行允许的最大推理轮次。
      worker-max-turns: 8
    # 事务提交后立即调度之外的持久化补偿投递。
    dispatch-outbox:
      # 扫描待投递 Dispatch Outbox 的间隔，用于补偿遗漏或失败的调度信号。
      publish-interval: ${MANGA_CREATIVE_DISPATCH_OUTBOX_PUBLISH_INTERVAL:1s}
    # 租约过期与待调度步骤的恢复扫描。
    reconciliation:
      # 执行恢复扫描的间隔。
      interval: ${MANGA_CREATIVE_RECONCILIATION_INTERVAL:5s}
    # Step 执行权、调度领取、重试退避与批处理限制。
    execution:
      # 数据库 Step 执行权租约时长，Agent 执行期间按该时长的三分之一周期续签。
      step-lease: ${MANGA_CREATIVE_STEP_LEASE:30s}
      # 单条 Dispatch Outbox 被投递实例独占领取的有效期。
      outbox-claim-lease: ${MANGA_CREATIVE_DISPATCH_OUTBOX_CLAIM_LEASE:15s}
      # 调度投递失败后的首次退避时长，后续按指数增长。
      outbox-retry-base: ${MANGA_CREATIVE_DISPATCH_OUTBOX_RETRY_BASE:1s}
      # 调度投递重试退避允许达到的最大时长。
      outbox-retry-max: ${MANGA_CREATIVE_DISPATCH_OUTBOX_RETRY_MAX:1m}
      # 阶段一模拟执行器两段输出之间的间隔，设为 0ms 可取消模拟等待。
      fake-delta-interval: ${MANGA_CREATIVE_FAKE_DELTA_INTERVAL:100ms}
      # 单轮 Outbox 投递或恢复扫描的最大记录数，单位：条。
      batch-size: ${MANGA_CREATIVE_BATCH_SIZE:100}
    # 创建 Run 和事件时冻结的契约版本及运行期限。
    runtime:
      # 写入新 Run 的创作执行引擎版本标识。
      engine-version: durable-v1
      # 写入新 Run 的工作流定义版本标识。
      workflow-version: v1
      # Event Envelope 的结构版本，供持久化事件和 SSE 消费者识别协议。
      event-schema-version: 1
      # 单次 Run 从受理到结束的最长允许时长，用于生成 deadline_at。
      run-timeout: ${MANGA_CREATIVE_RUN_TIMEOUT:30m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Manga platform backend service
    version: '@project.version@'

logging:
  file:
    name: logs/manga-server.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{40} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    com.manga: INFO

wx:
  # 微信公众号扫码登录与服务端事件回调。
  gzh:
    # 用于申请接口访问令牌和二维码的公众号 AppID。
    app-id: ${MANGA_WECHAT_GZH_APP_ID:}
    # 公众号 AppSecret，通过环境变量提供，不写入源码或日志。
    secret: ${MANGA_WECHAT_GZH_SECRET:}
    # 微信服务器回调签名校验使用的自定义 Token。
    token: ${MANGA_WECHAT_GZH_TOKEN:}
    # 微信公众号接口服务基础地址。
    api-base-url: ${MANGA_WECHAT_API_BASE_URL:https://api.weixin.qq.com}
    # 展示登录二维码的基础地址，后续拼接二维码 ticket。
    qr-code-base-url: ${MANGA_WECHAT_QR_CODE_BASE_URL:https://mp.weixin.qq.com/cgi-bin/showqrcode?ticket=}
    # 平台登录二维码使用的微信场景值前缀。
    scene-prefix: manga_login_
